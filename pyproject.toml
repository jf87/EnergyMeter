[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-energymeter"
version = "2.0.2"
description = "A library to measure energy consumption of applications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
  { name = "Mauricio Fadel Argerich", email = "maufadel@icloud.com" }
]

dependencies = [
  "pynvml",
  "pyRAPL",
  "numpy",
  "pandas",
  "matplotlib"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/maufadel/EnergyMeter"
Repository = "https://github.com/maufadel/EnergyMeter"

[tool.setuptools.packages.find]
where = ["src"]
